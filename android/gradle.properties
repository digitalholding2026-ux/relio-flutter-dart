# Cette machine dispose de 4 Go de RAM au total. Le template Flutter demande
# 8 Go de tas, ce qui est superieur a la memoire physique : le daemon Gradle se
# fait alors tuer par le systeme (« Gradle build daemon disappeared
# unexpectedly »), de facon aleatoire.
#
# On fixe donc un tas compatible avec la machine, et on interdit les daemons
# multiples : un seul processus Java, qui survit entre les builds.
org.gradle.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=512M -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=1
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
