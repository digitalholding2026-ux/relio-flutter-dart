name: relio
description: "Relio - tuteur personnel de mathématiques."
publish_to: 'none'
version: 0.4.2+15

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Persistance locale (mission D) : SQLite typé + migrations versionnées.
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.42
  path: ^1.9.1
  path_provider: ^2.1.5

  # Sérialisation des structures de données (versions de schéma).
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.2
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  fonts:
    # Inter — quatre poids droits + un italique, sous-ensemble latin et
    # latin étendu. Licence SIL OFL 1.1 dans assets/fonts/Inter-OFL.txt.
    #
    # Chaque fichier a `wght` ÉPINGLÉ : le poids est porté par le fichier
    # lui-même, donc `fontWeight` suffit. Un italique AUTHENTIQUE est fourni
    # pour les variables d'énoncé — sans lui, les italiques seraient
    # simulés par le moteur de rendu.
    #
    # Fichiers produits par docs/inter_build.py (fontTools).
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Italic-Regular.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
